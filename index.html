<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Racing Bingo">
<title>Ace & Max Racing Bingo</title>

<style>
:root{
  --red:#e21b2d;
  --red2:#ff3b4d;
  --dark:#080a0f;
  --panel:#12161e;
  --panel2:#191e28;
  --text:#fff;
  --muted:#9da5b3;
  --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--dark);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% -10%,rgba(226,27,45,.18),transparent 35%),
    linear-gradient(180deg,#0a0c11 0%,#080a0f 100%);
}
button{font:inherit;border:0;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.35;cursor:not-allowed}

header{text-align:center;padding:18px 14px 10px}
h1{
  margin:0;
  font-size:clamp(25px,6vw,54px);
  font-weight:1000;
  letter-spacing:1px;
}
.subtitle{
  margin-top:5px;color:var(--muted);
  font-size:clamp(12px,2.5vw,19px);
  font-weight:800;letter-spacing:2px;
}
.checkered{
  height:9px;margin:14px -14px 0;
  background:repeating-conic-gradient(#fff 0 25%,#151515 0 50%) 50%/24px 24px;
  border-top:3px solid var(--red);
  border-bottom:3px solid var(--red);
}

main{width:min(1100px,100%);margin:auto;padding:15px}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:12px;
}
.badge{
  background:var(--panel);border:1px solid var(--line);
  padding:8px 12px;border-radius:999px;
  font-size:13px;font-weight:900;color:var(--muted);
}
.badge strong{color:#fff}

.display{
  width:100%;height:min(58vh,610px);min-height:300px;
  background:#fff;border-radius:28px;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;position:relative;
  box-shadow:0 18px 55px rgba(0,0,0,.55),0 0 0 4px #20252e;
}
.display::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 70px rgba(0,0,0,.10);
}
.display img{width:92%;height:92%;object-fit:contain;position:relative;z-index:1}
.start-message{
  color:#111;text-align:center;
  font-size:clamp(30px,6vw,65px);
  font-weight:1000;line-height:1.05;
}
.flash{animation:flash .45s ease}
@keyframes flash{
  0%{transform:scale(.94);opacity:.15}
  55%{transform:scale(1.025);opacity:1}
  100%{transform:scale(1);opacity:1}
}

.current-name{
  margin-top:15px;text-align:center;
  font-size:clamp(25px,5vw,48px);
  font-weight:1000;text-transform:uppercase;
}
.counter{text-align:center;color:var(--muted);font-size:15px;margin:5px 0 13px}

.controls{
  display:flex;justify-content:center;align-items:center;
  flex-wrap:wrap;gap:9px;
}
.btn{
  min-height:48px;padding:12px 17px;border-radius:999px;
  background:#fff;color:#111;font-weight:1000;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
}
.draw-button{
  background:linear-gradient(135deg,var(--red),var(--red2));
  color:#fff;font-size:21px;padding:15px 28px;
  box-shadow:0 8px 25px rgba(226,27,45,.30);
}
.status{
  min-height:27px;text-align:center;margin-top:10px;
  color:#dce1e8;font-weight:800;font-size:15px;
}

.called-box{
  margin:18px auto 0;padding:15px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:20px;
}
.called-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:11px;
}
.called-title{font-size:16px;font-weight:1000}
.clear-info{font-size:12px;color:var(--muted)}
.called-list{
  display:flex;flex-wrap:wrap;gap:7px;
  max-height:135px;overflow-y:auto;
}
.called-item{
  padding:8px 11px;border-radius:999px;
  background:#292f39;border:1px solid rgba(255,255,255,.06);
  font-size:13px;font-weight:800;
}
.called-item.latest{
  background:var(--red);color:#fff;
  box-shadow:0 4px 12px rgba(226,27,45,.3);
}

.help{
  margin:15px auto 0;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.help-card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:12px;text-align:center;
}
.help-card .icon{font-size:22px}
.help-card strong{display:block;font-size:12px;margin-top:4px}
.help-card span{font-size:11px;color:var(--muted)}

.toast{
  position:fixed;left:50%;bottom:24px;z-index:50;
  transform:translate(-50%,20px);
  background:#fff;color:#111;padding:11px 17px;
  border-radius:999px;font-weight:900;
  opacity:0;pointer-events:none;transition:.25s;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* =========================================================
   PRESENTATION MODE
   Landscape-first layout for iPhone, TV and projector.
   The page cannot force iPhone Safari to rotate, but once the
   phone is rotated sideways this layout fills the screen.
   ========================================================= */

.presentation-title{
  display:none;
}

.presentation-exit{
  display:none;
  position:fixed;
  top:max(10px, env(safe-area-inset-top));
  right:max(10px, env(safe-area-inset-right));
  z-index:120;
  background:rgba(10,12,17,.88);
  color:#fff;
  border:1px solid rgba(255,255,255,.20);
  border-radius:999px;
  padding:10px 16px;
  font-size:clamp(12px,1.4vw,18px);
  font-weight:1000;
  white-space:nowrap;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

body.presentation-mode{
  overflow:hidden;
  width:100%;
  height:100dvh;
  min-height:100dvh;
}

body.presentation-mode header,
body.presentation-mode .topbar,
body.presentation-mode .counter,
body.presentation-mode .called-box,
body.presentation-mode .help,
body.presentation-mode .toast{
  display:none !important;
}

body.presentation-mode .presentation-exit{
  display:block;
}

body.presentation-mode main{
  width:100%;
  max-width:none;
  height:100dvh;
  min-height:100dvh;
  margin:0;
  padding:
    max(8px, env(safe-area-inset-top))
    max(10px, env(safe-area-inset-right))
    max(8px, env(safe-area-inset-bottom))
    max(10px, env(safe-area-inset-left));
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  gap:0;
}

body.presentation-mode .presentation-title{
  display:block;
  width:calc(100% - 170px);
  margin:0 auto 6px;
  font-size:clamp(22px,4.2vw,46px);
  line-height:1.05;
  font-weight:1000;
  letter-spacing:1px;
  text-transform:uppercase;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

body.presentation-mode .display{
  width:min(94vw,1500px);
  height:clamp(300px,62dvh,620px);
  min-height:0;
  flex:0 1 auto;
  border-radius:24px;
  box-shadow:
    0 14px 45px rgba(0,0,0,.55),
    0 0 0 4px #20252e;
}

body.presentation-mode .display img{
  width:96%;
  height:96%;
  object-fit:contain;
}

body.presentation-mode .current-name{
  width:94vw;
  margin:7px auto 0;
  font-size:clamp(25px,4.2vw,54px);
  line-height:1.05;
  font-weight:1000;
  text-align:center;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

body.presentation-mode .status{
  width:94vw;
  min-height:0;
  margin:4px auto 0;
  font-size:clamp(11px,1.5vw,18px);
  line-height:1.1;
  text-align:center;
}

body.presentation-mode .controls{
  position:fixed;
  left:50%;
  bottom:max(10px, env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:110;
  width:min(78vw,850px);
  padding:7px;
  display:flex !important;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:rgba(10,12,17,.86);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 10px 35px rgba(0,0,0,.45);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

body.presentation-mode .controls .draw-button{
  display:block;
  width:100%;
  min-height:52px;
  padding:11px 24px;
  font-size:clamp(20px,2.8vw,32px);
  border-radius:999px;
}

body.presentation-mode .controls .sound-button,
body.presentation-mode .controls .music-button,
body.presentation-mode .controls .undo-button,
body.presentation-mode .controls .reset-button,
body.presentation-mode .controls .presentation-button{
  display:none !important;
}

/* Landscape phones / TVs / projectors */
@media (orientation:landscape){
  body.presentation-mode main{
    padding-top:max(5px, env(safe-area-inset-top));
  }

  /* Larger presentation title, but leave room for Exit */
  body.presentation-mode .presentation-title{
    width:calc(100% - 230px);
    margin-bottom:5px;
    font-size:clamp(22px,4vw,46px);
  }

  /* MAXIMIZE THE CARD DISPLAY */
  body.presentation-mode .display{
    width:min(96vw,1600px);
    height:clamp(360px,71dvh,610px);
    flex:0 0 auto;
    border-radius:24px;
  }

  body.presentation-mode .display img{
    width:98%;
    height:98%;
  }

  /* Put the card name immediately above DRAW NEXT */
  body.presentation-mode .current-name{
    position:fixed;
    left:50%;
    bottom:76px;
    transform:translateX(-50%);
    z-index:105;
    width:92vw;
    margin:0;
    font-size:clamp(25px,4vw,54px);
    line-height:1;
    text-shadow:0 3px 12px rgba(0,0,0,.65);
  }

  /* Keep the extra status out of the presentation area */
  body.presentation-mode .status{
    display:none !important;
  }

  body.presentation-mode .controls{
    width:min(62vw,760px);
  }
}

/* Short landscape screens, such as iPhone landscape */
@media (orientation:landscape) and (max-height:500px){
  body.presentation-mode .presentation-title{
    font-size:clamp(18px,3.5vw,34px);
    margin-bottom:3px;
  }

  body.presentation-mode .display{
    height:64dvh;
    width:96vw;
    border-radius:18px;
  }

  body.presentation-mode .current-name{
    bottom:61px;
    font-size:clamp(20px,3.4vw,38px);
  }

  body.presentation-mode .status{
    display:none !important;
  }

  body.presentation-mode .controls{
    width:min(58vw,650px);
    bottom:5px;
    padding:5px;
  }

  body.presentation-mode .controls .draw-button{
    min-height:44px;
    padding:8px 18px;
    font-size:clamp(18px,2.8vw,27px);
  }

  body.presentation-mode .presentation-exit{
    top:6px;
    right:8px;
    padding:7px 12px;
    font-size:12px;
  }
}

/* Portrait fallback: keeps everything usable and asks the user
   to rotate the phone rather than pretending the browser can do it. */
@media (orientation:portrait){
  body.presentation-mode .presentation-title{
    width:calc(100% - 20px);
    margin-top:8px;
    font-size:clamp(21px,7vw,34px);
    white-space:normal;
  }

  body.presentation-mode .display{
    width:94vw;
    height:55dvh;
  }

  body.presentation-mode .current-name{
    font-size:clamp(24px,7vw,40px);
  }

  body.presentation-mode .controls{
    width:92vw;
  }
}

</style>
</head>

<body>
<header>
  <h1>🏁 ACE & MAX RACING BINGO 🏎️</h1>
  <div class="subtitle">READY, SET, BINGO!</div>
  <div class="checkered"></div>
</header>

<main>
  <button class="presentation-exit" id="presentationExit">✕ EXIT PRESENTATION</button>

  <div class="topbar">
    <div class="badge">🎯 <strong id="remainingTop">24</strong> CARDS LEFT</div>
    <div class="badge">CALLED <strong id="calledTop">0</strong></div>
  </div>

  <div class="presentation-title" id="presentationTitle">ACE & MAX RACING BINGO</div>

  <section class="display" id="display">
    <div class="start-message">PRESS<br>🏁 DRAW NEXT 🏁</div>
  </section>

  <div class="current-name" id="currentName">LET'S RACE!</div>
  <div class="counter" id="counter">0 of 24 called</div>

  <div class="controls">
    <button class="btn draw-button" id="drawButton">🏁 DRAW NEXT</button>
    <button class="btn sound-button" id="soundButton">🔇 SOUND OFF</button>
    <button class="btn music-button" id="musicButton">🎵 MUSIC OFF</button>
    <button class="btn undo-button" id="undoButton">↩ UNDO</button>
    <button class="btn reset-button" id="resetButton">↻ RESET</button>
    <button class="btn presentation-button" id="fullscreenButton">📺 PRESENTATION</button>
  </div>

  <div class="status" id="status">Tap DRAW NEXT to start the race!</div>

  <section class="called-box">
    <div class="called-head">
      <div class="called-title">🏁 CALLED SO FAR</div>
      <div class="clear-info">No duplicates</div>
    </div>
    <div class="called-list" id="calledList"></div>
  </section>

  <section class="help">
    <div class="help-card"><div class="icon">🎲</div><strong>RANDOM</strong><span>Every card once</span></div>
    <div class="help-card"><div class="icon">↩</div><strong>UNDO</strong><span>Reverse last draw</span></div>
    <div class="help-card"><div class="icon">📺</div><strong>PRESENTATION</strong><span>Rotate for landscape</span></div>
  </section>
</main>

<!-- Background music: keep ace_max_racing_bingo_loop.wav beside index.html -->
<audio id="backgroundMusic"
       src="ace_max_racing_bingo_loop.wav"
       loop
       preload="auto"></audio>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ACE & MAX RACING BINGO
   24 UNIQUE PICTURE CARDS
   Keep the "images" folder beside this index.html.
   ========================================================= */

const cards = [
  {name:"Tools", image:"images/01_tools.jpg"},
  {name:"Racing Gloves", image:"images/02_racing_gloves.jpg"},
  {name:"Timer", image:"images/03_timer.jpg"},
  {name:"Racing Driver", image:"images/04_racing_driver.jpg"},
  {name:"Stopwatch", image:"images/05_stopwatch.jpg"},
  {name:"Race Car", image:"images/06_race_car.jpg"},
  {name:"Red Race Car", image:"images/07_red_race_car.jpg"},
  {name:"Start Gate", image:"images/08_start_gate.jpg"},
  {name:"Steering Wheel", image:"images/09_steering_wheel.jpg"},
  {name:"Trophy", image:"images/10_trophy.jpg"},
  {name:"Finish Gate", image:"images/11_finish_gate.jpg"},
  {name:"Traffic Lights", image:"images/12_traffic_lights.jpg"},
  {name:"Direction Sign", image:"images/13_direction_sign.jpg"},
  {name:"Wheel", image:"images/14_wheel.jpg"},
  {name:"Speedometer", image:"images/15_speedometer.jpg"},
  {name:"Pit Stop", image:"images/16_pit_stop.jpg"},
  {name:"Medal", image:"images/17_medal.jpg"},
  {name:"Checkered Flag", image:"images/18_checkered_flag.jpg"},
  {name:"Green Race Car", image:"images/19_green_race_car.jpg"},
  {name:"Racetrack", image:"images/20_racetrack.jpg"},
  {name:"Fuel Pump", image:"images/21_fuel_pump.jpg"},
  {name:"Racing Helmet", image:"images/22_racing_helmet.jpg"},
  {name:"Traffic Cone", image:"images/23_traffic_cone.jpg"},
  {name:"Podium", image:"images/24_podium.jpg"}
];

let remainingCards = [...cards];
let calledCards = [];
let soundOn = false;
let audioContext = null;
let musicOn = false;

const backgroundMusic = document.getElementById("backgroundMusic");
const musicButton = document.getElementById("musicButton");

const display = document.getElementById("display");
const currentName = document.getElementById("currentName");
const counter = document.getElementById("counter");
const calledList = document.getElementById("calledList");
const status = document.getElementById("status");
const drawButton = document.getElementById("drawButton");
const soundButton = document.getElementById("soundButton");
const undoButton = document.getElementById("undoButton");
const resetButton = document.getElementById("resetButton");
const fullscreenButton = document.getElementById("fullscreenButton");
const remainingTop = document.getElementById("remainingTop");
const calledTop = document.getElementById("calledTop");
const toast = document.getElementById("toast");

function updateScreen(){
  counter.textContent = `${calledCards.length} of ${cards.length} called`;
  remainingTop.textContent = remainingCards.length;
  calledTop.textContent = calledCards.length;

  calledList.innerHTML = "";

  calledCards.forEach((card,index)=>{
    const item=document.createElement("div");
    item.className="called-item";
    if(index === calledCards.length-1) item.classList.add("latest");
    item.textContent=card.name;
    calledList.appendChild(item);
  });

  drawButton.disabled = remainingCards.length === 0;
  undoButton.disabled = calledCards.length === 0;
}

function showToast(message){
  toast.textContent=message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>toast.classList.remove("show"),1800);
}

function drawNext(){
  // The first tap is a user interaction, so iPhone Safari allows audio to start here.
  if(!musicOn) startMusic();
  if(!soundOn) {
    soundOn = true;
    soundButton.textContent = "🔊 SOUND ON";
  }

  if(remainingCards.length===0){
    status.textContent="🏆 ALL 24 CARDS HAVE BEEN CALLED!";
    showToast("🏆 Bingo draw complete!");
    return;
  }

  const randomIndex=Math.floor(Math.random()*remainingCards.length);
  const selectedCard=remainingCards.splice(randomIndex,1)[0];
  calledCards.push(selectedCard);

  display.innerHTML="";
  const image=document.createElement("img");
  image.src=selectedCard.image;
  image.alt=selectedCard.name;
  image.onerror=()=>status.textContent=`⚠️ Image missing: ${selectedCard.image}`;
  display.appendChild(image);

  display.classList.remove("flash");
  void display.offsetWidth;
  display.classList.add("flash");

  currentName.textContent=selectedCard.name.toUpperCase();

  if(remainingCards.length===0){
    status.textContent="🏆 ALL CARDS HAVE BEEN CALLED!";
  }else{
    status.textContent="🎉 MARK IT ON YOUR BINGO CARD!";
  }

  if(soundOn) raceSound();
  updateScreen();
}

function undoLast(){
  if(calledCards.length===0) return;

  const lastCard=calledCards.pop();
  remainingCards.push(lastCard);

  if(calledCards.length===0){
    display.innerHTML='<div class="start-message">PRESS<br>🏁 DRAW NEXT 🏁</div>';
    currentName.textContent="LET'S RACE!";
    status.textContent="↩ LAST CALL UNDONE";
  }else{
    const previous=calledCards[calledCards.length-1];
    display.innerHTML=`<img src="${previous.image}" alt="${previous.name}">`;
    currentName.textContent=previous.name.toUpperCase();
    status.textContent="↩ LAST CALL UNDONE";
  }

  updateScreen();
}

function resetGame(){
  if(calledCards.length && !confirm("Reset the Bingo game and clear all called cards?")) return;

  remainingCards=[...cards];
  calledCards=[];

  display.innerHTML='<div class="start-message">PRESS<br>🏁 DRAW NEXT 🏁</div>';
  currentName.textContent="LET'S RACE!";
  status.textContent="GAME RESET";

  updateScreen();
}

function getAudio(){
  if(!audioContext){
    audioContext=new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioContext.state==="suspended") audioContext.resume();
  return audioContext;
}

function beep(frequency,duration,delay=0){
  const ctx=getAudio();
  const oscillator=ctx.createOscillator();
  const gain=ctx.createGain();

  oscillator.type="square";
  oscillator.frequency.value=frequency;

  gain.gain.setValueAtTime(.04,ctx.currentTime+delay);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+duration);

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start(ctx.currentTime+delay);
  oscillator.stop(ctx.currentTime+delay+duration);
}

function raceSound(){
  beep(330,.08,0);
  beep(440,.08,.10);
  beep(550,.08,.20);
  beep(660,.18,.30);
}

async function startMusic(){
  try{
    backgroundMusic.volume = 0.22;
    await backgroundMusic.play();
    musicOn = true;
    musicButton.textContent = "🎵 MUSIC ON";
  }catch(error){
    musicOn = false;
    musicButton.textContent = "🎵 MUSIC OFF";
    showToast("Tap MUSIC again to start");
  }
}

function stopMusic(){
  backgroundMusic.pause();
  backgroundMusic.currentTime = 0;
  musicOn = false;
  musicButton.textContent = "🎵 MUSIC OFF";
}

musicButton.addEventListener("click", async ()=>{
  if(musicOn){
    stopMusic();
    showToast("🎵 Music off");
  }else{
    await startMusic();
    if(musicOn) showToast("🎵 Music on");
  }
});

soundButton.addEventListener("click",()=>{
  soundOn=!soundOn;
  soundButton.textContent=soundOn ? "🔊 SOUND ON" : "🔇 SOUND OFF";
  if(soundOn){
    raceSound();
    showToast("🔊 Sound enabled");
  }
});

drawButton.addEventListener("click",drawNext);
undoButton.addEventListener("click",undoLast);
resetButton.addEventListener("click",resetGame);

const presentationExit = document.getElementById("presentationExit");

async function enterPresentationMode(){
  document.body.classList.add("presentation-mode");

  // One direct tap starts both audio systems together.
  soundOn = true;
  soundButton.textContent = "🔊 SOUND ON";

  try{
    await startMusic();
    raceSound();
    showToast("📺 Presentation + 🎵 Music + 🔊 Sound");
  }catch(error){
    raceSound();
    showToast("📺 Presentation Mode");
  }

  // Try native fullscreen where supported.
  try{
    if(document.documentElement.requestFullscreen && !document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }
  }catch(error){
    // iPhone Safari may reject the native fullscreen request.
  }

  // Try locking to landscape where the browser supports it.
  // iOS Safari commonly does not expose this API; the page still
  // responds automatically when the user rotates the phone.
  try{
    if(screen.orientation && screen.orientation.lock){
      await screen.orientation.lock("landscape");
    }
  }catch(error){
    // Expected on unsupported iPhone/Safari versions.
  }
}

async function exitPresentationMode(){
  document.body.classList.remove("presentation-mode");

  try{
    if(document.fullscreenElement && document.exitFullscreen){
      await document.exitFullscreen();
    }
  }catch(error){
    // Ignore browser-specific fullscreen errors.
  }
}

fullscreenButton.textContent = "📺 PRESENTATION";

fullscreenButton.addEventListener("click", enterPresentationMode);
presentationExit.addEventListener("click", exitPresentationMode);

document.addEventListener("fullscreenchange",()=>{
  // If the browser exits native fullscreen, keep presentation mode
  // only if the user did not explicitly press EXIT.
});

document.addEventListener("keydown",event=>{
  if(event.key === "Escape" && document.body.classList.contains("presentation-mode")){
    exitPresentationMode();
  }
});

document.addEventListener("keydown",event=>{
  if(event.code==="Space"){
    event.preventDefault();
    drawNext();
  }
});

updateScreen();
</script>
